# Admin-facing routes.
#
# The EasyAdmin dashboard route (planedo_admin, /admin) and all CRUD routes
# below it are generated by EasyAdmin from the #[AdminDashboard] attribute on
# Crell\Bundle\Planedo\Controller\Admin\DashboardController. Applications must
# import the "easyadmin.routes" route loader for them to exist.
# The user settings page is likewise registered via #[AdminRoute].

planedo_login:
  path: /login
  controller: Crell\Bundle\Planedo\Controller\LoginController::index

planedo_logout:
  path: /logout
  controller: Crell\Bundle\Planedo\Controller\LoginController::logout

planedo_forgot_password_request:
  path: /reset-password
  controller: Crell\Bundle\Planedo\Controller\ResetPasswordController::request

planedo_check_email:
  path: /check-email
  controller: Crell\Bundle\Planedo\Controller\ResetPasswordController::checkEmail

planedo_reset_password:
  path: /reset/{token}
  controller: Crell\Bundle\Planedo\Controller\ResetPasswordController::reset
  defaults:
    token: null
